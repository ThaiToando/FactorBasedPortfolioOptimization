# The frozen, headline configuration (SPEC S4).
# These values are identical to the defaults in src/fbpo/config.py; a test
# enforces that. Do not edit this file to run a variant -- add a new one.
seed: 42

data:
  universe: dow30_static_2021
  price_start: "2008-06-02"
  price_end: "2022-01-04"          # EXCLUSIVE -> yields data through 2021-12-31
  signal_start: "2003-01-31"
  signal_set: signals_full          # {signals_auto, signals_full, signals_stable}
  market_source: french             # F-F_Research_Data_Factors_daily
  auto_adjust: true
  trading_days_per_year: 252

backtest:
  first_rebalance: "2009-12-31"
  last_rebalance: "2021-11-30"
  frequency: monthly                # last NYSE trading day of the month
  expected_rebalances: 144
  intramonth_rebalancing: false     # weights drift within the month
  return_type_estimation: log
  return_type_compounding: simple

estimation:
  window: 252                       # trading days
  min_obs: 252                      # asset eligibility threshold
  beta_shrinkage: none              # {none, blume, vasicek}
  covariance: sample                # {sample, ledoit_wolf, oas, single_index, ewma, yang_zhang}
  ewma_halflife: 63
  single_index_delta: 0.5

forecast:
  model: svr                        # {prevailing_mean, combination, ridge, pca_ols, pls, svr, gp, gbm}
  min_train_months: 60
  tune: true
  refit_every: 12
  cv_splits: 4
  embargo_months: 1
  campbell_thompson: true
  shrink_omega: 1.0                 # 1.0 = pure model; 0.5 = half-shrunk to prevailing mean
  target: market_excess_monthly

svr:
  kernel: rbf
  standardize_X: true
  standardize_y: true               # CRITICAL - guards the epsilon-tube flat-forecast trap
  grid:
    C: [0.1, 1.0, 10.0, 100.0]
    gamma: ["scale", 0.001, 0.01, 0.1]
    epsilon: [0.01, 0.05, 0.1, 0.2]

optimize:
  objective: max_sharpe             # {max_sharpe, gmvp, mdrp, min_cvar, equal_weight, inverse_vol}
  solver: clarabel
  long_only: true
  fully_invested: true
  weight_cap: 1.0                   # set 0.10 for the capped variant
  fallback_when_no_positive_mu: gmvp
  turnover_penalty: 0.0
  robust_kappa: 0.0

costs:
  bps_per_side: 0.0                 # headline is gross
  cost_sweep_bps: [0.0, 5.0, 10.0, 20.0]

simulation:
  n_paths: 1000
  block_length_days: 21
  bootstrap: stationary             
  mean_perturbation_sigma: [0.0, 0.01, 0.02, 0.05]

sensitivity_grid:
  window: [63, 126, 252, 504]
  frequency: [weekly, monthly, quarterly]
  universe: [dow30_static_2021, dow30_pit, sp100_static_2021,
             random30_seed0, random30_seed1, random30_seed2,
             random30_seed3, random30_seed4]
  subperiod: ["2010-2013", "2014-2017", "2018-2021", "2010-2019", "2020-2021"]

stats:
  bootstrap_reps: 10000
  block_length_days: 21
  newey_west_lags: 5
  cvar_alpha: 0.95
  conformal_alpha: 0.10
  aci_gamma: 0.01
  cpcv_groups: 6
  cpcv_test_groups: 2
  cpcv_embargo_days: 5
  pbo_blocks: 16
  vol_target_annual: 0.10
  vol_target_window: 21
  vol_target_cap: 1.0