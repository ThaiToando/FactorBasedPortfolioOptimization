[project]
name = "fbpo"
version = "0.1.0"
description = "Factor-based portfolio optimization: reproduction and extension of Auh & Cho (2023), Economics Letters 228, 111137."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14",
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "arch>=7.0",
  "yfinance>=0.2.50,<0.3",
  "pandas-datareader>=0.10",
  "pyarrow>=16",
  "matplotlib>=3.9",
  "pydantic>=2.8",
  "pyyaml>=6",
  "typer>=0.12",
  "threadpoolctl>=3.5",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "slowapi>=0.1.9", "skops>=0.10"]
notebook = ["marimo>=0.9"]

[project.scripts]
fbpo = "fbpo.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-regressions>=2.5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "nbstripout>=0.7",
  "pandera>=0.20",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbpo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
# N815: config fields mirror YAML / scikit-learn keys verbatim (standardize_X, C).
ignore = ["E501", "N815"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long-running (excluded from the fast suite)",
  "network: requires internet access",
]

[tool.coverage.run]
source = ["src/fbpo"]